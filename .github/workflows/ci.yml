name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Single-threaded build (WASM configuration)
        run: cargo test -p geom-core --no-default-features
      - name: Scene schema is up to date
        run: |
          cargo run -q -p scene-schema --bin export-schema schema/scene.schema.json
          git diff --exit-code schema/

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Forbidden packages (LICENSES.md blacklist)
        run: python3 scripts/check_blacklist.py
