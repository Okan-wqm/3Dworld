# cargo-deny configuration: license gate for Rust dependencies.
# Must stay in sync with the allowlist in LICENSES.md.

[graph]
all-features = true

[licenses]
# Allowlist from LICENSES.md. Anything else (GPL, AGPL, NC, custom) fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allowlist mirrors LICENSES.md, so entries no crate uses yet are expected.
unused-allowed-license = "allow"

# Our own crates are not published and use the project's LICENSE file.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# The advisory database needs network access; CI runs it, local runs may skip it.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
