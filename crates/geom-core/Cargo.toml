[package]
name = "geom-core"
description = "CPU geometry core for 3Dworld: point maps, depth meshes, GLB/PLY writers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Multi-threaded mesh building with rayon. Disabled for the single-threaded WASM build.
parallel = ["dep:rayon"]

[dependencies]
scene-schema.workspace = true
glam.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
gltf.workspace = true

[[example]]
name = "bench"
